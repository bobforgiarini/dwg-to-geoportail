[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/openlayers"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/mlightcad-workers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mlightcad-workers/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
